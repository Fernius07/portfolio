name: Sync GitHub & LinkedIn Telemetry

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run profile sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXYCURL_API_KEY: ${{ secrets.PROXYCURL_API_KEY }}
          LINKEDIN_PROFILE_URL: https://www.linkedin.com/in/i%C3%B1igo-fernandez-garcia/
        run: node scripts/sync-profile.mjs

      - name: Commit updated telemetry if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/linkedin-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): update profile telemetry"
            git push
          else
            echo "No profile changes detected."
          fi
